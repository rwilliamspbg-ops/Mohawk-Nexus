name: perf-regression

# Benchmarks run on the self-hosted `bench-host` runner so numbers come from a
# stable 16-core host instead of GitHub's 2-4 core shared runners. That makes
# this workflow a code-execution surface on that host, so it must never be
# reachable from an untrusted event.
#
# No `pull_request` trigger: this repo is public, so a fork PR would otherwise
# schedule arbitrary code on the runner. Pushes to main and manual dispatch are
# both trusted. Fork PRs still get the ordinary GitHub-hosted `ci` gates, they
# just forfeit the benchmark comparison.
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  bench-go-sdk:
    # Belt and braces on top of the trigger filter: this workflow executes on a
    # self-hosted runner, so it must refuse to start from an untrusted event
    # even if a `pull_request` trigger is ever re-added above.
    if: >-
      github.event_name != 'pull_request' &&
      github.event_name != 'pull_request_target'
    runs-on: [self-hosted, bench-host]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'

      - name: Run Go SDK benchmarks
        run: |
          mkdir -p benchmarks/pr-run
          go test ./sdk/go/mohawksdk -bench . -run ^$ -benchmem -count 10 2>&1 | tee benchmarks/pr-run/go-sdk-bench-pr.txt

      - name: Compare with baseline
        run: |
          python3 scripts/compare_benchmarks.py --bench-file benchmarks/pr-run/go-sdk-bench-pr.txt --baseline benchmarks/baselines/go_sdk_baseline.json --threshold-percent 10.0

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v7
        with:
          name: pr-benchmarks-go-sdk
          path: benchmarks/pr-run
          retention-days: 7

  bench-and-compare:
    if: >-
      github.event_name != 'pull_request' &&
      github.event_name != 'pull_request_target'
    runs-on: [self-hosted, bench-host]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'

      - name: Run short crypto benchmark
        run: |
          mkdir -p SMIP-MWP/benchmarks/pr-run
          go test ./SMIP-MWP/internal/crypto -bench . -run ^$ -benchmem -count 3 2>&1 | tee SMIP-MWP/benchmarks/pr-run/crypto-bench-pr.txt

      - name: Compare with baseline
        run: |
          python3 scripts/compare_benchmarks.py --bench-file SMIP-MWP/benchmarks/pr-run/crypto-bench-pr.txt --baseline benchmarks/baselines/crypto-baseline.json --threshold-percent 5.0

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v7
        with:
          name: pr-benchmarks-crypto
          path: SMIP-MWP/benchmarks/pr-run
          retention-days: 7

  collect-profiles:
    runs-on: ubuntu-latest
    needs: bench-and-compare
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build docker images
        run: |
          docker compose build fl-coordinator fl-client-1 fl-client-2 swip-client

      - name: Start services
        run: |
          docker compose up -d fl-coordinator fl-client-1 fl-client-2 swip-client prometheus
          # wait for health endpoints
          for i in {1..30}; do
            if curl -sS http://localhost:9000/healthz >/dev/null 2>&1 && curl -sS http://localhost:9100/healthz >/dev/null 2>&1; then
              echo 'services healthy'
              break
            fi
            sleep 2
          done

      - name: Capture profiles
        run: |
          mkdir -p ci-profiles
          curl -sS "http://localhost:9000/debug/profile?duration=5" -o ci-profiles/fl-profile.html || true
          curl -sS "http://localhost:9100/debug/profile?duration=5" -o ci-profiles/swip-profile.html || true

      - name: Upload profiles
        uses: actions/upload-artifact@v7
        with:
          name: ci-profiles
          path: ci-profiles
          retention-days: 30
